# Server Port
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:jana_ai}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Vishwakarma@1014}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Flyway Migration Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Security & JWT Configuration
app.jwt.secret=${JWT_SECRET:9a4f2c8d3e716b5a4f3e2d1c0b9a8f7e6d5c4b3a2f1e0d9c8b7a6f5e4d3c2b1a}
app.jwt.access-token-expiration-ms=${JWT_ACCESS_EXPIRATION:3600000}
app.jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXPIRATION:604800000}
app.jwt.issuer=jana-ai

# AI Chatbot Integration Configuration
app.ai.provider=${AI_PROVIDER:gemini}
app.ai.gemini.api-key=${GEMINI_API_KEY:}
app.ai.gemini.base-url=https://generativelanguage.googleapis.com/v1beta
app.ai.gemini.model=gemini-flash-lite-latest
app.ai.openai.api-key=${OPENAI_API_KEY:}
app.ai.openai.base-url=https://api.openai.com/v1
app.ai.openai.model=gpt-4o-mini

# CORS Policy Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Logging Levels
logging.level.org.springframework.security=INFO
logging.level.com.janaai=DEBUG

# Spring Mail (SMTP Settings)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME:}
spring.mail.password=${GMAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Test Recipient Redirection Override
app.mail.test-recipient=${TEST_RECIPIENT_EMAIL:}
